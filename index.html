<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CPA Study Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f1e8;--paper:#fffdf7;--ink:#1b211f;--muted:#666d68;--line:#e2dccd;--soft:#ece7da;
  --ok:#2e7a4c;--bad:#b3432e;--warn:#a8701a;--accent:#1f5f5b;--accent-soft:rgba(31,95,91,.1);
  --r:14px;--shadow:0 1px 0 rgba(0,0,0,.04),0 6px 20px -12px rgba(30,30,20,.25);
  --serif:"Fraunces",Georgia,serif;--sans:"IBM Plex Sans",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#121514;--paper:#1a1e1d;--ink:#ebe7dd;--muted:#9aa19c;--line:#2b3130;--soft:#232827;--shadow:0 1px 0 rgba(0,0,0,.3),0 8px 24px -14px rgba(0,0,0,.7)}
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
.wrap{max-width:900px;margin:0 auto;padding:0 18px 80px}
header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header.top .in{max-width:900px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:10px}
.brand{font-family:var(--serif);font-weight:650;font-size:19px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px;background:none;border:0;padding:0}
.brand .mk{width:26px;height:26px;border-radius:7px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-family:var(--mono);font-size:12px}
.spacer{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:500;white-space:nowrap}
.chip.mono{font-family:var(--mono)}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.chip.run{border-color:var(--accent);color:var(--accent)}
h1,h2,h3{font-family:var(--serif);font-weight:650;letter-spacing:-.015em;margin:0}
h1{font-size:clamp(28px,6vw,40px);line-height:1.1}
h2{font-size:20px}
h3{font-size:17px}
.eyebrow{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.small{font-size:13.5px}
.hero{padding:30px 0 10px}
.hero p{max-width:560px;color:var(--muted);margin:10px 0 0}
.grid{display:grid;gap:12px}
.g3{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.g2{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
.sec-tile{text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);position:relative;overflow:hidden;transition:transform .15s,border-color .15s;display:flex;flex-direction:column;gap:8px}
.sec-tile:hover{transform:translateY(-2px);border-color:var(--c)}
.sec-tile::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c)}
.sec-tile .code{font-family:var(--mono);font-weight:600;font-size:22px;color:var(--c)}
.sec-tile .nm{font-family:var(--serif);font-weight:650;font-size:17px;line-height:1.2}
.bar{height:6px;border-radius:9px;background:var(--soft);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--c,var(--accent));border-radius:9px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.between{justify-content:space-between}
.groupttl{margin:26px 0 10px;display:flex;align-items:baseline;gap:10px}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:9px 14px;font-weight:500;font-size:14.5px;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--soft)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.45;pointer-events:none}
.sechead{padding:20px 0 4px}
.sechead .code{font-family:var(--mono);color:var(--accent);font-weight:600}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:14px 0 18px;overflow-x:auto}
.tabs button{background:none;border:0;padding:10px 12px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--ink);border-color:var(--accent)}
.strat{text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;gap:12px;align-items:flex-start;box-shadow:var(--shadow);transition:border-color .15s}
.strat:hover{border-color:var(--accent)}
.strat .ic{flex:none;width:36px;height:36px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:17px;font-weight:600}
.strat b{display:block;font-weight:600}
.strat span{font-size:13.5px;color:var(--muted);line-height:1.4;display:block;margin-top:2px}
.strat .badge{margin-left:auto}
.badge{font-family:var(--mono);font-size:12px;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:2px 8px;font-weight:600}
.badge.bad{background:rgba(179,67,46,.12);color:var(--bad)}
.today{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:16px;border-left:4px solid var(--accent)}
.stat{display:flex;flex-direction:column}
.stat .n{font-family:var(--mono);font-size:24px;font-weight:600;line-height:1.1}
.stat .l{font-size:12.5px;color:var(--muted)}
input[type=text],input[type=search],input[type=number],select,textarea{width:100%;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea{min-height:90px;resize:vertical}
label.f{display:block;margin:0 0 12px}
label.f>span{display:block;font-size:13px;font-weight:600;margin-bottom:5px}
.item{display:flex;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line)}
.item .main{flex:1;min-width:0}
.item .q{font-weight:500}
.item .a{color:var(--muted);font-size:14px;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item .acts{display:flex;gap:2px;align-items:flex-start}
.tag{font-size:11.5px;border-radius:6px;padding:1px 7px;background:var(--soft);color:var(--muted);font-weight:500}
.tag.k{font-family:var(--mono);background:var(--accent-soft);color:var(--accent)}
.dots{display:inline-flex;gap:2px;vertical-align:middle}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent)}
.star{color:var(--muted)}
.star.on{color:#d39b1c}
/* run views */
.runbar{display:flex;align-items:center;gap:10px;padding:14px 0}
.prog{flex:1;height:5px;background:var(--soft);border-radius:9px;overflow:hidden}
.prog>i{display:block;height:100%;background:var(--accent);transition:width .25s}
.flip{perspective:1400px;margin:8px 0 16px;cursor:pointer;user-select:none}
.flip-in{display:grid;transition:transform .45s cubic-bezier(.3,.7,.3,1);transform-style:preserve-3d}
.flip.on .flip-in{transform:rotateY(180deg)}
.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--paper);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);min-height:280px;padding:28px 24px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;
  background-image:repeating-linear-gradient(to bottom,transparent 0 31px,var(--soft) 31px 32px);background-position:0 18px}
.face.back{transform:rotateY(180deg)}
.face .t{font-family:var(--serif);font-size:clamp(20px,4.5vw,27px);font-weight:500;line-height:1.3;white-space:pre-wrap}
.face.back .t{font-family:var(--sans);font-size:clamp(16px,3.6vw,19px);line-height:1.5}
.face .hint{position:absolute;bottom:12px;font-size:12px;color:var(--muted)}
.face .lbl{position:absolute;top:12px;left:16px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.face{position:relative}
.qtext{font-family:var(--serif);font-size:clamp(19px,4vw,23px);font-weight:500;line-height:1.35;margin:6px 0 16px;white-space:pre-wrap}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:9px;transition:border-color .12s,background .12s}
.opt:hover{border-color:var(--accent)}
.opt .k{flex:none;width:24px;height:24px;border-radius:7px;border:1px solid var(--line);display:grid;place-items:center;font-family:var(--mono);font-size:12px;color:var(--muted)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.right{border-color:var(--ok);background:rgba(46,122,76,.1)}
.opt.wrong{border-color:var(--bad);background:rgba(179,67,46,.09)}
.opt.right .k{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.wrong .k{background:var(--bad);color:#fff;border-color:var(--bad)}
.lock .opt{pointer-events:none}
.expl{border-left:3px solid var(--accent);background:var(--paper);padding:12px 14px;border-radius:0 10px 10px 0;margin:10px 0;font-size:15px}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grades .btn{flex-direction:column;gap:0;padding:9px 4px}
.grades .btn small{font-size:11px;color:var(--muted);font-family:var(--mono)}
.g-again{border-color:rgba(179,67,46,.5)!important}
.g-good{border-color:rgba(46,122,76,.5)!important}
.big2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.big2 .btn{padding:13px}
.navgrid{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.navgrid button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--paper);font-family:var(--mono);font-size:13px;position:relative}
.navgrid button.ans{background:var(--accent-soft);border-color:var(--accent)}
.navgrid button.cur{outline:2px solid var(--ink);outline-offset:1px}
.navgrid button.fl::after{content:"";position:absolute;top:-3px;right:-3px;width:9px;height:9px;border-radius:50%;background:var(--warn)}
.timer{font-family:var(--mono);font-weight:600;font-size:15px}
.timer.low{color:var(--bad)}
.match{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:9px}
.mt{min-height:96px;background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:10px;font-size:13.5px;line-height:1.35;text-align:center;display:flex;align-items:center;justify-content:center;transition:all .15s}
.mt.term{font-weight:600;font-family:var(--serif);font-size:15px}
.mt.sel{border-color:var(--accent);background:var(--accent-soft)}
.mt.bad{border-color:var(--bad);animation:shake .3s}
.mt.gone{opacity:0;pointer-events:none;transform:scale(.9)}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.result{text-align:center;padding:26px 10px}
.result .score{font-family:var(--mono);font-size:54px;font-weight:600;color:var(--accent);line-height:1}
.boxes{display:flex;gap:4px;align-items:flex-end;height:90px;margin-top:8px}
.boxes div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.boxes i{display:block;width:100%;background:var(--accent);border-radius:5px 5px 2px 2px;min-height:2px;opacity:.85}
.boxes small{font-size:11px;color:var(--muted);font-family:var(--mono)}
.trow{display:grid;grid-template-columns:1fr 110px 44px;gap:10px;align-items:center;padding:7px 0;font-size:14px;border-bottom:1px dashed var(--line)}
.trow .pct{font-family:var(--mono);text-align:right;font-size:13px}
.heat{display:flex;gap:4px;flex-wrap:wrap}
.heat i{width:16px;height:16px;border-radius:4px;background:var(--soft)}
.heat i.l1{background:color-mix(in srgb,var(--accent) 35%,var(--soft))}
.heat i.l2{background:color-mix(in srgb,var(--accent) 65%,var(--soft))}
.heat i.l3{background:var(--accent)}
.empty{text-align:center;padding:40px 16px;color:var(--muted)}
.note{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center;margin-top:30px}
.ai{white-space:pre-wrap;font-size:15px;line-height:1.55}
.shot{display:flex;align-items:center;gap:10px;margin:-4px 0 12px;padding:10px;border:1.5px dashed var(--line);border-radius:12px}
.check{display:flex;gap:10px;align-items:flex-start;padding:6px 0}
.check input{margin-top:4px;width:auto}
/* modal */
#modal{position:fixed;inset:0;z-index:50;display:none;align-items:flex-end;justify-content:center;background:rgba(10,12,11,.45)}
#modal.open{display:flex}
#modal .sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:20px 18px 24px;box-shadow:0 -10px 40px rgba(0,0,0,.25);animation:up .22s ease}
@media (min-width:640px){#modal{align-items:center}#modal .sheet{border-radius:18px}}
@keyframes up{from{transform:translateY(30px);opacity:.4}}
.sheet h2{margin-bottom:14px}
.sheet .foot{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.choicerow{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.choicerow input[type=radio]{width:20px;height:20px;accent-color:var(--ok);flex:none}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 12px;font-size:13.5px}
.seg button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:all .2s;z-index:60;pointer-events:none;max-width:90vw}
#toast.on{opacity:1;transform:translateX(-50%)}
.splash{display:grid;place-items:center;min-height:60vh;color:var(--muted)}
.kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 4px;color:var(--muted)}
@media (max-width:520px){.hide-sm{display:none}.grades .btn{font-size:13px}}
</style>
</head>
<body>
<header class="top"><div class="in">
  <button class="brand" data-act="home"><span class="mk">CPA</span><span>Study Hub</span></button>
  <span class="spacer"></span>
  <button class="chip mono" id="pomoChip" data-act="pomo" title="Focus timer">◷ 25:00</button>
</div></header>
<main class="wrap" id="app"><div class="splash">Loading your study data…</div></main>
<div id="modal"><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>

<script>
/* ---------------- Section metadata & starter content ---------------- */
const SECTIONS = {
  AUD:{name:'Auditing and Attestation',kind:'Core',color:'#1f6f6a',blurb:'Engagement acceptance, risk assessment, evidence, reports, ethics & independence.'},
  FAR:{name:'Financial Accounting and Reporting',kind:'Core',color:'#2f4f93',blurb:'US GAAP topics, revenue, leases, governmental and not-for-profit reporting.'},
  REG:{name:'Taxation and Regulation',kind:'Core',color:'#a63c2c',blurb:'Individual & entity taxation, property transactions, business law, tax ethics.'},
  BAR:{name:'Business Analysis and Reporting',kind:'Discipline',color:'#9c6410',blurb:'Managerial & cost accounting, financial analysis, advanced technical accounting.'},
  ISC:{name:'Information Systems and Controls',kind:'Discipline',color:'#6a42a3',blurb:'IT general controls, security & privacy, data management, SOC engagements.'},
  TCP:{name:'Tax Compliance and Planning',kind:'Discipline',color:'#2e7a46',blurb:'Entity & individual tax planning, property transactions, gift & trust taxation.'}
};
const ORDER=['AUD','FAR','REG','BAR','ISC','TCP'];

const STARTER = {
AUD:{cards:[
['Reasonable assurance','A high, but not absolute, level of assurance that the financial statements are free of material misstatement.','Engagement basics'],
['Audit risk model','AR = RMM × DR, where risk of material misstatement (RMM) = inherent risk × control risk.','Risk assessment'],
['Detection risk','Risk that the auditor\'s procedures will not detect a material misstatement. Inversely related to RMM — the higher the RMM, the lower the acceptable detection risk (more substantive testing).','Risk assessment'],
['Vouching vs. tracing','Vouching: from the recorded entry back to source documents → tests existence/occurrence.\nTracing: from source documents forward to the records → tests completeness.','Evidence'],
['Qualified vs. adverse opinion','Material but NOT pervasive misstatement → qualified ("except for").\nMaterial AND pervasive misstatement → adverse.','Reports'],
['Disclaimer of opinion','Issued when the auditor cannot obtain sufficient appropriate evidence and the possible effects of undetected misstatements could be both material and pervasive.','Reports'],
['Going concern evaluation period (AICPA)','Substantial doubt is evaluated for a reasonable period: within one year after the date the financial statements are issued (or available to be issued).','Reports'],
['Type I vs. Type II subsequent events','Type I (recognized): condition existed at the balance sheet date → adjust the FS.\nType II (nonrecognized): condition arose after the BS date → disclose, do not adjust.','Completion'],
['Dual dating','Dating the report as of the original report date except for a specific note dated later, so the auditor\'s responsibility for later events is limited to that note.','Reports'],
['Risk of incorrect acceptance','Sampling risk of concluding a balance is fairly stated when it is materially misstated — affects audit EFFECTIVENESS. (Incorrect rejection affects efficiency.)','Sampling'],
['Partner rotation for SEC issuers','Lead and concurring audit partners rotate off after 5 years and then have a 5-year time-out.','Ethics & independence'],
['Engagement letter','Written agreement documenting the terms of the audit: objective and scope, auditor and management responsibilities, the applicable framework, and expected form of reports.','Engagement basics']
],mcqs:[
['To reduce detection risk, an auditor would most likely:',['Increase the extent of substantive testing','Reduce the assessed level of inherent risk','Increase reliance on internal controls','Perform tests of controls at an interim date'],0,'Detection risk is the only component the auditor controls directly — lowering it means doing more (or more effective, or better-timed) substantive procedures.','Risk assessment'],
['Tracing shipping documents to recorded sales entries primarily provides evidence that:',['Recorded sales actually occurred','All shipments were recorded as sales','Sales were properly valued','Sales were recorded in the correct period only'],1,'Tracing goes from the source document (shipment) forward to the records, so it tests completeness.','Evidence'],
['The financial statements contain a misstatement that is material and pervasive. The auditor should issue:',['A qualified opinion','An unmodified opinion with an emphasis-of-matter paragraph','An adverse opinion','A disclaimer of opinion'],2,'Material + pervasive misstatement → adverse. A disclaimer is for an inability to obtain evidence, not a known misstatement.','Reports'],
['Which component of audit risk is NOT part of the risk of material misstatement?',['Inherent risk','Control risk','Detection risk','None — all three make up RMM'],2,'RMM = inherent risk × control risk. Detection risk is separate and is the one the auditor manages.','Risk assessment'],
['After year-end but before the report date, a major customer files for bankruptcy due to a financial decline that began well before year-end. The auditor should expect the client to:',['Only disclose the event','Adjust the allowance for doubtful accounts','Do nothing because it occurred after year-end','Restate prior-year statements'],1,'The underlying condition existed at the balance sheet date, so this is a Type I (recognized) subsequent event requiring adjustment.','Completion'],
['The risk of assessing control risk too low relates to:',['Audit efficiency','Audit effectiveness','Nonsampling risk','Inherent risk'],1,'Over-relying on controls can lead to too little substantive work and an incorrect conclusion — an effectiveness problem.','Sampling']
]},
FAR:{cards:[
['5 steps of revenue recognition (ASC 606)','1) Identify the contract\n2) Identify performance obligations\n3) Determine the transaction price\n4) Allocate the price to the obligations\n5) Recognize revenue when (or as) each obligation is satisfied','Revenue'],
['Finance lease criteria (lessee) — "OWNES"','Ownership transfers; Written purchase option reasonably certain; Net PV of payments ≥ substantially all of FV; Economic life — term is a major part; Specialized asset. Any one → finance lease.','Leases'],
['Inventory measurement after ASU 2015-11','FIFO & average cost: lower of cost and net realizable value (LCNRV).\nLIFO & retail inventory method: still lower of cost or market (LCM).','Inventory'],
['"Market" under LCM','Replacement cost, but not above the ceiling (NRV) and not below the floor (NRV − normal profit margin).','Inventory'],
['Loss contingency','Accrue if probable AND reasonably estimable. Disclose if reasonably possible. Remote — generally no disclosure.','Contingencies'],
['Change in principle vs. estimate vs. error','Principle → retrospective application.\nEstimate (incl. depreciation method) → prospective.\nError → restate prior periods (prior-period adjustment).','Accounting changes'],
['Diluted EPS methods','Options & warrants → treasury stock method.\nConvertible debt/preferred → if-converted method.\nIgnore antidilutive securities.','EPS'],
['Government-wide statements','Economic resources measurement focus, full accrual basis of accounting.','Governmental'],
['Governmental funds','Current financial resources measurement focus, modified accrual basis.\nFive types: general, special revenue, capital projects, debt service, permanent.','Governmental'],
['NFP net asset classes','Net assets with donor restrictions and net assets without donor restrictions.','Not-for-profit'],
['Bond issued at a discount','Carrying value increases toward face over the term; interest expense (effective rate) exceeds the cash interest paid.','Bonds'],
['Goodwill impairment (ASU 2017-04)','Impairment = carrying amount of the reporting unit − its fair value, limited to the goodwill allocated to that unit.','Intangibles']

/* ---------------- Utilities ---------------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const clone=o=>JSON.parse(JSON.stringify(o));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const dkey=(d=new Date())=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const pct=(a,b)=>b?Math.round(100*a/b):0;
const fmt=s=>{s=Math.max(0,Math.round(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');};
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),2400);}
function timeout(p,ms){return Promise.race([p,new Promise((_,r)=>setTimeout(()=>r({code:'timeout'}),ms))]);}
function lsGet(k){try{const v=localStorage.getItem('cpahub:'+k);return v?JSON.parse(v):null;}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem('cpahub:'+k,JSON.stringify(v));}catch(e){}}

/* ---------------- Storage ---------------- */
const Store={db:null,uid:null,mode:'local',timers:{},busy:{},again:{},cache:{},
  async init(){
    try{
      if(!window.claude||!claude.use) return;
      const [db,user]=await timeout(Promise.all([claude.use('db'),claude.use('user')]),11000);
      if(db&&user){const id=await user.id(); if(id){this.db=db;this.uid=id;this.mode='cloud';}}
    }catch(e){}
  },
  ref(k){return this.db.collection('data/users/'+this.uid).doc(k);},
  async load(k){
    let d=null;
    if(this.mode==='cloud'){
      try{const s=await timeout(this.ref(k).get(),10000); if(s.exists) d=clone(s.data());}
      catch(e){this.slow=true;}
    }
    if(!d) d=lsGet(k);
    this.cache[k]=d; return d;
  },
  save(k,v){
    this.cache[k]=v; lsSet(k,v);
    if(this.mode!=='cloud') return;
    clearTimeout(this.timers[k]);
    this.timers[k]=setTimeout(()=>this.flush(k),900);
  },
  async flush(k){
    if(this.busy[k]){this.again[k]=true;return;}
    this.busy[k]=true;
    try{await this.ref(k).set(clone(this.cache[k]));}
    catch(e){
      if(e&&e.code==='unavailable'){setTimeout(()=>this.flush(k),1500+Math.random()*1500);}
      else if(e&&e.code==='quota_exceeded'){toast('Storage is full — delete some cards to keep saving online.');}
      else if(e&&(e.code==='invalid_argument'||e.code==='revoked'||e.code==='not_granted')){this.mode='local';toast('Saving in this browser only for now.');}
    }
    this.busy[k]=false;
    if(this.again[k]){this.again[k]=false;this.flush(k);}
  }
};

/* ---------------- State ---------------- */
const S={sec:null,tab:'study',data:{},prefs:null,run:null,q:'',filter:'all',sample:null};
const D=()=>S.data[S.sec];
function blank(){return {v:1,seeded:false,cards:[],mcqs:[],sessions:[],notes:[],matchBest:null};}
function seed(sec,d){
  const st=STARTER[sec];
  st.cards.forEach(([f,b,t])=>d.cards.push(newCard(f,b,t,'starter')));
  st.mcqs.forEach(([q,c,a,x,t])=>d.mcqs.push(newMcq(q,c,a,x,t,'starter')));
  d.seeded=true;
}
function newCard(f,b,t,src='me'){return {id:uid(),f,b,t:t||'General',star:false,box:0,due:0,ok:0,miss:0,lr:null,last:0,src};}
function newMcq(q,c,a,x,t,src='me'){return {id:uid(),q,c,a,x:x||'',t:t||'General',star:false,ok:0,miss:0,lr:null,last:0,src};}
function save(){Store.save(S.sec,D());}
function savePrefs(){Store.save('prefs',S.prefs);}
function logActivity(n=1){const k=dkey();S.prefs.log[k]=(S.prefs.log[k]||0)+n;savePrefs();}
function topics(d){return [...new Set([...d.cards.map(c=>c.t),...d.mcqs.map(m=>m.t)])].sort();}
function dueCards(d){const now=Date.now();return d.cards.filter(c=>c.box>0&&c.due<=now);}
function newCards(d){return d.cards.filter(c=>c.box===0);}
function weakItems(d){const w=x=>x.miss>0&&(x.lr===0||x.miss>=x.ok);return {cards:d.cards.filter(w),mcqs:d.mcqs.filter(w)};}
function mastered(d){return d.cards.filter(c=>c.box>=4).length;}
function streak(){const log=S.prefs.log;let n=0;const d=new Date();if(!log[dkey(d)])d.setDate(d.getDate()-1);while(log[dkey(d)]){n++;d.setDate(d.getDate()-1);}return n;}
function applySecTheme(){
  const c=S.sec?SECTIONS[S.sec].color:'#1f5f5b';
  document.documentElement.style.setProperty('--accent',c);
  document.documentElement.style.setProperty('--accent-soft',c+'1c');
}

/* ---------------- Boot ---------------- */
(async function boot(){
  await Store.init();
  S.prefs=(await Store.load('prefs'))||{log:{},pomos:0,last:null};
  S.prefs.log=S.prefs.log||{};
  await Promise.all(ORDER.map(async k=>{
    let d=await Store.load(k);
    if(!d){d=blank();}
    d.cards=d.cards||[];d.mcqs=d.mcqs||[];d.sessions=d.sessions||[];d.notes=d.notes||[];
    if(!d.seeded){seed(k,d);Store.save(k,d);}
    S.data[k]=d;
  }));
  const h=location.hash.replace('#','').toUpperCase();
  if(SECTIONS[h]) S.sec=h;
  applySecTheme(); render();
  try{const sm=await claude.use('sample'); if(sm){S.sample=sm; try{S.sampleImages=!!(await sm.limits()).images;}catch(e){} if(!S.run) render();}}catch(e){}
})();

  const d=D(),due=dueCards(d).length,nw=newCards(d).length,w=weakItems(d),wn=w.cards.length+w.mcqs.length;

  else if(wn>=3){sug=`${wn} items you've missed are waiting.`;sugMode='weak';}

function shotBar(){
  return `<div class="shot"><button type="button" class="btn sm" id="shotBtn">📷 Fill from screenshot</button><span class="muted small hide-sm">or paste an image here</span><input type="file" id="shotIn" accept="image/*" hidden></div><div id="shotMsg" class="small muted" style="margin:-4px 0 10px"></div>`;
}
function wireShot(kind){
  $('#shotBtn').onclick=()=>$('#shotIn').click();
  $('#shotIn').onchange=e=>{const f=e.target.files[0];if(f)readShot(kind,f);e.target.value='';};
  $('#sheet').onpaste=e=>{const it=[...(e.clipboardData?.items||[])].find(i=>i.type.startsWith('image/'));if(it){e.preventDefault();readShot(kind,it.getAsFile());}};
}
async function shrink(file){
  try{const bm=await createImageBitmap(file);const k=Math.min(1,1800/Math.max(bm.width,bm.height));
    const cv=document.createElement('canvas');cv.width=Math.round(bm.width*k);cv.height=Math.round(bm.height*k);
    cv.getContext('2d').drawImage(bm,0,0,cv.width,cv.height);
    return await new Promise(r=>cv.toBlob(b=>r(b||file),'image/jpeg',.9));}catch(e){return file;}
}
async function readShot(kind,file){
  const msg=$('#shotMsg'),btn=$('#shotBtn');if(!msg)return;
  btn.disabled=true;msg.style.color='';msg.textContent='Reading your screenshot…';
  try{
    const img=await shrink(file);
    const out=(S.sample&&S.sampleImages)?await claudeShot(kind,img):await ocrShot(kind,img,msg);
    if(!$('#shotMsg'))return;
    if(kind==='mc'){
      if(!out.question||!out.choices||out.choices.length<2)throw {message:'nothing found'};
      $('#fQ').value=out.question;
      const ins=[...document.querySelectorAll('.fC')];ins.forEach((el,i)=>el.value=out.choices[i]||'');
      if(out.choices.length>ins.length)ins[ins.length-1].value=out.choices.slice(ins.length-1).join(' / ');
      const radios=[...document.querySelectorAll('input[name=ans]')];
      if(Number.isInteger(out.answer)&&radios[out.answer])radios[out.answer].checked=true;
      if(out.explanation)$('#fX').value=out.explanation;
      if(out.topic&&!$('#fT').value)$('#fT').value=out.topic;
      msg.style.color=out.answerSource==='marked'?'var(--ok)':'var(--warn)';
      msg.textContent=out.answerSource==='marked'?'✓ Filled in from your screenshot. Give it a quick check, then save.'
        :out.answerSource==='solved'?'✓ Filled in. The screenshot didn\'t show the answer, so Claude chose it — double-check before saving.'
        :'✓ Text filled in. Select the correct answer and fix any misread words before saving.';
    }else{
      if(!out.front)throw {message:'nothing found'};
      $('#fF').value=out.front;$('#fB').value=out.back||'';
      if(out.topic&&!$('#fT').value)$('#fT').value=out.topic;
      msg.style.color='var(--ok)';msg.textContent='✓ Filled in from your screenshot. Check it, then save.';
    }
  }catch(e){
    if(!$('#shotMsg'))return;
    msg.style.color='var(--bad)';
    msg.textContent=e&&e.code==='rate_limited'?'Too many requests — try again in a moment.':e&&e.code==='ocr_load'?'Couldn\'t load the text reader. Check your connection and try again.':'Couldn\'t read a question from that image. Try a tighter crop around the question and choices.';
  }
  if($('#shotBtn'))$('#shotBtn').disabled=false;
}
async function claudeShot(kind,img){
  const prompt=kind==='mc'?`This image is a screenshot from CPA exam study material (section ${S.sec}: ${SECTIONS[S.sec].name}). Extract the FIRST multiple-choice question in it.
Copy the question stem and each answer choice exactly as written (fix only broken line wraps). Leave out choice labels like "A." or "(b)". Include any table or figures in the stem as plain text.
If the screenshot marks the correct answer (highlight, check mark, "correct" label, answer key), use it and set answerSource to "marked". Otherwise work out the correct answer yourself as an expert CPA tutor and set answerSource to "solved". If the screenshot shows an explanation, copy its key points; otherwise write a short one (max 50 words).
Return ONLY JSON: {"question":"","choices":["",""],"answer":0,"answerSource":"marked","explanation":"","topic":"2-4 word topic"}`
  :`This image is a screenshot from CPA exam study material (section ${S.sec}: ${SECTIONS[S.sec].name}). Turn it into ONE flashcard.
front: the term, concept or question shown, copied as written. back: the definition or answer shown, copied as written; if none is shown, write a concise, accurate one (max 45 words).
Return ONLY JSON: {"front":"","back":"","topic":"2-4 word topic"}`;
  let v;
  try{v=await S.sample.json(prompt,{images:[img],modelTier:'default'});}
  catch(e){if(e&&(e.code==='rate_limited'||e.code==='not_granted'))throw e;const r=await S.sample(prompt,{images:[img],modelTier:'default'});v=JSON.parse(r.text.slice(r.text.indexOf('{'),r.text.lastIndexOf('}')+1));}
  if(kind==='mc'&&v){v.choices=(v.choices||[]).map(String).filter(Boolean);if(!Number.isInteger(v.answer)||!v.choices[v.answer]){v.answer=null;v.answerSource='none';}}
  return v;
}
function loadTess(){
  if(window.Tesseract)return Promise.resolve();
  return new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';s.onload=res;s.onerror=()=>rej({code:'ocr_load'});document.head.appendChild(s);});
}
async function ocrShot(kind,img,msg){
  msg.textContent='Loading text reader (first time takes a few seconds)…';
  await loadTess();
  let data;
  try{({data}=await Tesseract.recognize(img,'eng',{logger:m=>{if(m.status==='recognizing text'&&$('#shotMsg'))$('#shotMsg').textContent='Reading text… '+Math.round(m.progress*100)+'%';}}));}
  catch(e){throw {code:'ocr_load'};}
  return kind==='mc'?parseMcText(data.text):parseCardText(data.text);
}
function parseMcText(text){
  const lines=text.split(/\r?\n/).map(l=>l.replace(/\s+/g,' ').trim()).filter(Boolean)
    .filter(l=>!/^(question|q)\s*\d+\s*(of\s*\d+)?$/i.test(l));
  const lab=/^[\(\[]?([A-Ea-e]|[1-5])[\.\)\]:]\s+(.+)$/;
  let q=[],ch=[],cur=-1;
  for(const l of lines){
    const m=l.match(lab);
    const want=ch.length;
    if(m&&(('ABCDE'.indexOf(m[1].toUpperCase())===want)||(String(want+1)===m[1]))){ch.push(m[2]);cur=ch.length-1;}
    else if(cur>=0)ch[cur]+=' '+l;
    else q.push(l);
  }
  if(ch.length<2&&lines.length>=5){q=lines.slice(0,-4);ch=lines.slice(-4);}
  q=q.join(' ').replace(/^\d+[\.\)]\s+/,'');
  return {question:q,choices:ch.slice(0,5),answer:null,answerSource:'none',explanation:'',topic:''};
}
function parseCardText(text){
  const paras=text.split(/\n\s*\n/).map(p=>p.replace(/\s+/g,' ').trim()).filter(Boolean);
  if(paras.length>=2)return {front:paras[0],back:paras.slice(1).join('\n')};
  const lines=text.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  return {front:lines[0]||'',back:lines.slice(1).join(' ')};
}

      <div class="shot" style="flex-wrap:wrap"><button type="button" class="btn sm" id="gPick">📷 Add page screenshot</button><span class="muted small">Up to 3 pages${'ontouchstart' in window?'':' · or paste an image'}</span><input type="file" id="gIn" accept="image/*" multiple hidden></div>

    <div id="gOut"></div>
    <div class="foot"><button class="btn" data-act="close">Cancel</button><button class="btn primary" id="gGo">Generate</button></div>`);
  const segs=(id,cb)=>{const el=$(id);if(el)el.onclick=e=>{const b=e.target.closest('button');if(!b)return;[...el.children].forEach(x=>x.classList.toggle('on',x===b));cb(b.dataset.v);};};
  segs('#gK',v=>kind=v);segs('#gN',v=>n=+v);
  segs('#gS',v=>{src=v;$('#gTopicBox').hidden=v==='page';$('#gPageBox').hidden=v!=='page';});
  const thumbs=()=>{$('#gThumbs').innerHTML=imgs.map((b,i)=>`<span style="position:relative"><img src="${URL.createObjectURL(b)}" style="height:64px;border-radius:8px;border:1px solid var(--line)"><button type="button" class="btn sm" data-rm="${i}" style="position:absolute;top:-8px;right:-8px;padding:0 6px;border-radius:99px">✕</button></span>`).join('');};
  $('#gThumbs').onclick=e=>{const b=e.target.closest('[data-rm]');if(b){imgs.splice(+b.dataset.rm,1);thumbs();}};
  const addFiles=async fs=>{for(const f of fs){if(imgs.length>=3){toast('Up to 3 pages at a time.');break;}imgs.push(await shrink(f));}thumbs();};
  if($('#gPick')){$('#gPick').onclick=()=>$('#gIn').click();$('#gIn').onchange=e=>{addFiles([...e.target.files]);e.target.value='';};}
  $('#sheet').onpaste=e=>{if(src!=='page')return;const fs=[...(e.clipboardData?.items||[])].filter(i=>i.type.startsWith('image/')).map(i=>i.getAsFile());if(fs.length){e.preventDefault();addFiles(fs);}};
  if(src==='topic')setTimeout(()=>$('#gT')&&$('#gT').focus(),60);
  $('#gGo').onclick=async()=>{
    const fromPage=src==='page';
    const topic=fromPage?'':$('#gT').value.trim();
    if(!fromPage&&!topic){toast('Enter a topic.');return;}
    if(fromPage&&!imgs.length){toast('Add a screenshot of the page first.');return;}
    const btn=$('#gGo');btn.disabled=true;btn.textContent='Generating…';$('#gOut').innerHTML=`<div class="muted small">${fromPage?'Reading your page and writing questions…':'Writing questions…'}</div>`;
    const shape=kind==='card'?'{"items":[{"front":"term or question","back":"concise answer, max 45 words","topic":"2-4 word topic"}]}':'{"items":[{"question":"exam-style stem","choices":["A","B","C","D"],"answer":0,"explanation":"why the answer is right and the others wrong, max 50 words","topic":"2-4 word topic"}]}';
    const what=kind==='card'?'flashcards':'multiple-choice questions with exactly 4 choices';
    const prompt=fromPage
?`You are an expert CPA exam tutor for the ${S.sec} (${SECTIONS[S.sec].name}) section. The attached image${imgs.length>1?'s are':' is a'} screenshot${imgs.length>1?'s':''} of a textbook or review-course page the student marked as important.
Write ${n} ${what} that test the key rules, definitions, exceptions, calculations and distinctions IN THIS PASSAGE. Base every item on the passage's content; do not test material it doesn't cover. Write them in your own words — don't copy long sentences from the page.${kind==='mc'?' Prefer applied, exam-style scenarios (with numbers where the passage has calculations) over pure recall. Make the wrong choices plausible common mistakes. In each explanation, point to the idea in the passage that gives the answer. "answer" is the 0-based index of the correct choice; vary its position.':''}
${$('#gFocus').value.trim()?'The student wants to focus on: '+$('#gFocus').value.trim()+'\n':''}If the image has no readable study content, return {"items":[]}.
Return ONLY JSON in this exact shape, no other text: ${shape}`
:`You are an expert CPA exam tutor writing study material for the ${S.sec} (${SECTIONS[S.sec].name}) section of the current CPA exam blueprint.
Write ${n} ${what} on the topic: "${topic}".
Be technically accurate under current US GAAP / AICPA / PCAOB / IRC rules as relevant. Avoid year-specific dollar thresholds unless essential. Vary difficulty; use realistic exam-style scenarios and numbers for questions. "answer" is the 0-based index of the correct choice; vary its position.
Return ONLY JSON in this exact shape, no other text: ${shape}`;
    const opts={modelTier:'default'};if(fromPage)opts.images=imgs;
    try{
      let val;
      try{val=await S.sample.json(prompt,opts);}
      catch(e){if(e&&(e.code==='not_granted'||e.code==='rate_limited'))throw e;const r=await S.sample(prompt,opts);val=JSON.parse(r.text.slice(r.text.indexOf('{'),r.text.lastIndexOf('}')+1));}
      const items=(val&&val.items||[]).filter(it=>kind==='card'?(it.front&&it.back):(it.question&&Array.isArray(it.choices)&&it.choices.length>=2&&Number.isInteger(it.answer)&&it.choices[it.answer]));
      if(!items.length)throw {message:fromPage?'nopage':'empty'};
      $('#gOut').innerHTML=`<div class="small muted" style="margin-bottom:6px">Untick any you don't want. AI can make mistakes — check anything surprising against your materials.</div>`+items.map((it,i)=>`<label class="check"><input type="checkbox" checked data-i="${i}"><span><b>${esc(kind==='card'?it.front:it.question)}</b><br><span class="muted small">${esc(kind==='card'?it.back:'✓ '+it.choices[it.answer])}</span></span></label>`).join('');
      btn.disabled=false;btn.textContent=`Add selected`;
      btn.onclick=()=>{const keep=[...document.querySelectorAll('#gOut input:checked')].map(x=>items[+x.dataset.i]);
        keep.forEach(it=>{const t=topic||String(it.topic||'From my notes');if(kind==='card')D().cards.unshift(newCard(String(it.front),String(it.back),t,'ai'));else D().mcqs.unshift(newMcq(String(it.question),it.choices.map(String),it.answer,String(it.explanation||''),t,'ai'));});
        save();closeModal();render();toast(`Added ${keep.length}`);};
    }catch(e){
      btn.disabled=false;btn.textContent='Try again';
      $('#gOut').innerHTML=`<div class="small" style="color:var(--bad)">${e&&e.code==='rate_limited'?'Too many requests — wait a moment and try again.':e&&e.code==='not_granted'?'Claude access was not granted for this page.':e&&e.message==='nopage'?'Couldn\'t find study content in that image. Try a clearer, closer screenshot of the text.':'Could not generate this time. Try again.'}</div>`;
    }
  };
}

/* ---------------- Session setup ---------------- */
function setupDlg(mode){
  const d=D(),tps=topics(d);
  const isQ=mode==='quiz'||mode==='exam';
  let opt={topic:'',n:mode==='exam'?10:mode==='quiz'?10:20,src:'mc',star:false,sec:90};
  openModal(`<h2>${MODE_NAMES[mode]}</h2>
    <p class="muted small" style="margin-top:-6px">${STRATS.find(s=>s.id===mode).why}</p>
    <label class="f"><span>Topic</span><select id="sT"><option value="">All topics</option>${tps.map(t=>`<option>${esc(t)}</option>`).join('')}</select></label>
    ${isQ?`<div class="f"><span style="display:block;font-size:13px;font-weight:600;margin-bottom:5px">Questions from</span><div class="seg" id="sSrc">
      <button class="on" data-v="mc">Multiple choice</button><button data-v="both">MC + flashcards</button><button data-v="card">Flashcards as MC</button></div></div>`:''}
    <div class="f"><span style="display:block;font-size:13px;font-weight:600;margin-bottom:5px">How many</span><div class="seg" id="sN">${[5,10,20,40,0].map(x=>`<button data-v="${x}" class="${x===opt.n?'on':''}">${x||'All'}</button>`).join('')}</div></div>
    ${mode==='exam'?`<div class="f"><span style="display:block;font-size:13px;font-weight:600;margin-bottom:5px">Time per question</span><div class="seg" id="sSec">${[60,75,90,120].map(x=>`<button data-v="${x}" class="${x===90?'on':''}">${x}s</button>`).join('')}</div><div class="muted small" style="margin-top:4px">About 90 seconds per multiple-choice question is a common pacing target.</div></div>`:''}
    <label class="check"><input type="checkbox" id="sStar"> <span>Starred only</span></label>
    <div class="muted small" id="sAvail"></div>
    <div class="foot"><button class="btn" data-act="close">Cancel</button><button class="btn primary" id="sGo">Start</button></div>`);
  const segs=(id,cb)=>{const el=$(id);if(!el)return;el.onclick=e=>{const b=e.target.closest('button');if(!b)return;[...el.children].forEach(x=>x.classList.toggle('on',x===b));cb(b.dataset.v);upd();};};
  const upd=()=>{opt.topic=$('#sT').value;opt.star=$('#sStar').checked;const p=buildPool(mode,opt);$('#sAvail').textContent=`${p.length} available`;$('#sGo').disabled=!p.length;};
  segs('#sSrc',v=>opt.src=v);segs('#sN',v=>opt.n=+v);segs('#sSec',v=>opt.sec=+v);
  $('#sT').onchange=upd;$('#sStar').onchange=upd;upd();
  $('#sGo').onclick=()=>{closeModal();startRun(mode,opt);};
}
function filt(arr,opt){return arr.filter(x=>(!opt.topic||x.t===opt.topic)&&(!opt.star||x.star));}
function cardAsMc(c,all){
  const others=shuffle(all.filter(o=>o.id!==c.id&&o.b!==c.b).map(o=>o.b));
  const sameT=shuffle(all.filter(o=>o.id!==c.id&&o.t===c.t&&o.b!==c.b).map(o=>o.b));
  const dis=[...new Set([...sameT,...others])].slice(0,3);
  if(dis.length<3)return null;
  const c4=shuffle([c.b,...dis]);
  return {kind:'card',id:c.id,q:c.f,label:'Which matches this term?',c:c4,a:c4.indexOf(c.b),x:'',t:c.t};
}
function mcItem(m){const idx=shuffle(m.c.map((_,i)=>i));return {kind:'mc',id:m.id,q:m.q,c:idx.map(i=>m.c[i]),a:idx.indexOf(m.a),x:m.x,t:m.t};}
function buildPool(mode,opt){
  const d=D();
  if(mode==='quiz'||mode==='exam'){
    let out=[];
    if(opt.src!=='card') out=out.concat(filt(d.mcqs,opt).map(mcItem));
    if(opt.src!=='mc') out=out.concat(filt(d.cards,opt).map(c=>cardAsMc(c,d.cards)).filter(Boolean));
    return out;
  }
  return filt(d.cards,opt);
}

/* ---------------- Runs ---------------- */
function startRun(mode,opt={}){
  const d=D();
  let r={mode,i:0,score:0,t0:Date.now()};
  if(mode==='flash'||mode==='write'){
    let p=shuffle(buildPool(mode,opt));if(opt.n)p=p.slice(0,opt.n);
    if(!p.length)return toast('No flashcards match.');
    Object.assign(r,{items:p.map(c=>c.id),flip:false,know:[],learn:[]});
  }else if(mode==='quiz'||mode==='exam'){
    let p=shuffle(buildPool(mode,opt));if(opt.n)p=p.slice(0,opt.n);
    if(!p.length)return toast('No questions match.');
    Object.assign(r,{items:p,pick:null,done:false,results:[]});
    if(mode==='exam'){r.ans=Array(p.length).fill(null);r.flags=[];r.end=Date.now()+p.length*opt.sec*1000;r.total=p.length*opt.sec;}
  }else if(mode==='review'){
    const q=[...shuffle(dueCards(d)),...shuffle(newCards(d)).slice(0,15)];
    if(!q.length){toast('Nothing due — nice work. Try Weak spots or an exam sim.');return;}
    Object.assign(r,{queue:q.map(c=>c.id),flip:false,seen:0,againN:0,tot:q.length});
  }else if(mode==='match'){
    const pool=shuffle(d.cards.filter(c=>c.b.length<=160&&c.f.length<=70)).slice(0,6);
    if(pool.length<3)return toast('You need at least 3 short flashcards for Match.');
    const tiles=shuffle(pool.flatMap(c=>[{k:c.id,txt:c.f,term:true},{k:c.id,txt:c.b,term:false}]));
    Object.assign(r,{tiles,sel:null,gone:[],bad:null,pen:0});
  }else if(mode==='weak'){
    const w=weakItems(d);
    const p=shuffle([...w.mcqs.map(mcItem),...w.cards.map(c=>cardAsMc(c,d.cards)).filter(Boolean)]).slice(0,20);
    if(!p.length){toast('No weak spots yet — they appear after you miss something.');return;}
    Object.assign(r,{mode:'quiz',weak:true,items:p,pick:null,done:false,results:[]});
  }else if(mode==='teach'){
    Object.assign(r,{topic:'',text:'',fb:'',stage:'pick'});
  }
  S.run=r;startTimer();render();window.scrollTo(0,0);
}
function endRun(){stopTimer();S.run=null;render();}
function pushSession(m,s,n){const d=D();d.sessions.push({d:Date.now(),m,s,n});if(d.sessions.length>60)d.sessions=d.sessions.slice(-60);save();}
function findItem(kind,id){const d=D();return kind==='mc'?d.mcqs.find(x=>x.id===id):d.cards.find(x=>x.id===id);}
function record(kind,id,ok){const x=findItem(kind,id);if(!x)return;if(ok)x.ok++;else x.miss++;x.lr=ok?1:0;x.last=Date.now();logActivity();save();}
function grade(c,g){const now=Date.now();
  if(g===0){c.box=1;c.due=now;c.miss++;c.lr=0;}
  else{if(g===1){c.box=Math.max(1,c.box);c.due=now+DAY;}else{c.box=Math.min(6,c.box+(g===3?2:1));c.due=now+INT[c.box]*DAY;}c.ok++;c.lr=1;}
  c.last=now;logActivity();save();}

let tick=null;
function startTimer(){stopTimer();tick=setInterval(()=>{const r=S.run;if(!r)return;
  if(r.mode==='exam'&&!r.done){const left=(r.end-Date.now())/1000;const el=$('#timer');if(el){el.textContent=fmt(left);el.classList.toggle('low',left<60);}if(left<=0)submitExam(true);}
  if(r.mode==='match'&&!r.fin){const el=$('#timer');if(el)el.textContent=((Date.now()-r.t0)/1000+r.pen).toFixed(1)+'s';}
},250);}
function stopTimer(){clearInterval(tick);tick=null;}

function runbar(cur,tot,extra=''){return `<div class="runbar"><button class="btn ghost sm" data-act="exit">✕ Exit</button><div class="prog"><i style="width:${pct(cur,tot)}%"></i></div><span class="small mono muted" style="font-family:var(--mono)">${cur}/${tot}</span>${extra}</div>`;}

function renderRun(){
  const r=S.run;
  switch(r.mode){
    case 'flash':return rFlash();case 'review':return rReview();case 'quiz':return rQuiz();
    case 'exam':return rExam();case 'write':return rWrite();case 'match':return rMatch();case 'teach':return rTeach();
  }
}
function face(front,back,flip,lblF='Term',lblB='Definition'){
  return `<div class="flip ${flip?'on':''}" data-act="flip"><div class="flip-in">
    <div class="face"><span class="lbl">${lblF}</span><div class="t">${esc(front)}</div><span class="hint">Tap to flip <span class="kbd hide-sm">space</span></span></div>
    <div class="face back"><span class="lbl">${lblB}</span><div class="t">${esc(back)}</div></div></div></div>`;
}
function rFlash(){
  const r=S.run;
  if(r.i>=r.items.length){
    return `${runbar(r.items.length,r.items.length)}<div class="result"><div class="eyebrow">Round complete</div><div class="score">${r.know.length}/${r.items.length}</div><p class="muted">${r.learn.length?`${r.learn.length} still learning — go again on just those.`:'You knew every card. 🎉'}</p>
      <div class="row" style="justify-content:center">${r.learn.length?`<button class="btn primary" data-act="flashAgain">Study ${r.learn.length} again</button>`:''}<button class="btn" data-act="exit">Done</button></div></div>`;
  }
  const c=findItem('card',r.items[r.i]);if(!c){r.i++;return rFlash();}
  return `${runbar(r.i,r.items.length)}
    <div class="row between small muted"><span class="tag">${esc(c.t)}</span><button class="btn ghost sm star ${c.star?'on':''}" data-act="starRun" data-id="${c.id}">${c.star?'★ Starred':'☆ Star'}</button></div>
    ${face(c.f,c.b,r.flip)}
    <div class="big2"><button class="btn g-again" data-act="fl" data-v="0">✗ Still learning <span class="kbd hide-sm">←</span></button><button class="btn g-good" data-act="fl" data-v="1">✓ Got it <span class="kbd hide-sm">→</span></button></div>`;
}
function rReview(){
  const r=S.run;
  if(!r.queue.length){
    return `${runbar(1,1)}<div class="result"><div class="eyebrow">Review done</div><div class="score">${r.seen}</div><p class="muted">cards reviewed${r.againN?` · ${r.againN} relearned`:''}. They'll come back on schedule.</p><button class="btn primary" data-act="exit">Done</button></div>`;
  }
  const c=findItem('card',r.queue[0]);if(!c){r.queue.shift();return rReview();}
  const nextBox=g=>g===0?'now':g===1?'1d':INT[Math.min(6,c.box+(g===3?2:1))]+'d';
  return `${runbar(r.tot-r.queue.length,r.tot,`<span class="badge">${c.box===0?'new':'lvl '+c.box}</span>`)}
    ${face(c.f,c.b,r.flip,'Prompt','Answer')}
    ${r.flip?`<div class="grades">
      <button class="btn g-again" data-act="gr" data-v="0">Again<small>${nextBox(0)}</small></button>
      <button class="btn" data-act="gr" data-v="1">Hard<small>${nextBox(1)}</small></button>
      <button class="btn g-good" data-act="gr" data-v="2">Good<small>${nextBox(2)}</small></button>
      <button class="btn" data-act="gr" data-v="3">Easy<small>${nextBox(3)}</small></button></div>
      <div class="muted small" style="text-align:center;margin-top:8px">Keys 1–4</div>`
    :`<button class="btn primary" style="width:100%;padding:13px" data-act="flip">Show answer</button>`}`;
}
function rQuiz(){
  const r=S.run,n=r.items.length;
  if(r.i>=n){
    const missed=r.results.filter(x=>!x.ok);
    return `${runbar(n,n)}<div class="result"><div class="eyebrow">${r.weak?'Weak spots drill':'Quiz'} complete</div><div class="score">${pct(r.score,n)}%</div><p class="muted">${r.score} of ${n} correct</p>
      <div class="row" style="justify-content:center">${missed.length?`<button class="btn primary" data-act="retryMissed">Retry ${missed.length} missed</button>`:''}<button class="btn" data-act="exit">Done</button></div></div>
      ${missed.length?`<h3 style="margin:10px 0">Review what you missed</h3>`+missed.map(m=>`<div class="panel" style="margin-bottom:10px"><div style="font-weight:500">${esc(m.it.q)}</div><div class="small" style="color:var(--bad);margin-top:6px">Your answer: ${esc(m.it.c[m.pick])}</div><div class="small" style="color:var(--ok)">Correct: ${esc(m.it.c[m.it.a])}</div>${m.it.x?`<div class="small muted" style="margin-top:6px">${esc(m.it.x)}</div>`:''}</div>`).join(''):''}`;
  }
  const it=r.items[r.i],done=r.pick!==null;
  return `${runbar(r.i,n,`<span class="badge">${r.score} ✓</span>`)}
    <div class="row"><span class="tag">${esc(it.t)}</span>${it.kind==='card'?`<span class="tag">${it.label}</span>`:''}</div>
    <div class="qtext">${esc(it.q)}</div>
    <div class="${done?'lock':''}">${it.c.map((c,i)=>{let cl='';if(done){if(i===it.a)cl='right';else if(i===r.pick)cl='wrong';}
      return `<button class="opt ${cl}" data-act="pick" data-v="${i}"><span class="k">${'ABCDE'[i]}</span><span>${esc(c)}</span></button>`;}).join('')}</div>
    ${done?`<div class="expl"><b style="color:${r.pick===it.a?'var(--ok)':'var(--bad)'}">${r.pick===it.a?'Correct.':'Not quite.'}</b> ${esc(it.x||(it.kind==='card'?'Answer: '+it.c[it.a]:''))}
      ${S.sample&&r.pick!==it.a?`<div style="margin-top:8px"><button class="btn sm" data-act="explain">✦ Explain this more</button></div><div class="ai small" id="aiExp" style="margin-top:8px"></div>`:''}</div>
      <button class="btn primary" style="width:100%;padding:13px" data-act="next">${r.i+1<n?'Next question':'See results'} <span class="kbd hide-sm" style="color:#fff;border-color:#fff6">enter</span></button>`:''}`;
}
function rExam(){
  const r=S.run,n=r.items.length;
  if(r.done){
    const right=r.items.filter((it,i)=>r.ans[i]===it.a).length;
    return `<div class="runbar"><button class="btn ghost sm" data-act="exit">✕ Exit</button></div>
    <div class="result"><div class="eyebrow">Exam simulation results</div><div class="score">${pct(right,n)}%</div><p class="muted">${right} of ${n} correct · ${fmt(r.used)} used of ${fmt(r.total)}${r.timeout?' · time ran out':''}</p><button class="btn primary" data-act="exit">Done</button></div>
    ${r.items.map((it,i)=>{const ok=r.ans[i]===it.a;return `<div class="panel" style="margin-bottom:10px;border-left:4px solid ${ok?'var(--ok)':'var(--bad)'}"><div class="small muted">Q${i+1} · ${esc(it.t)}</div><div style="font-weight:500">${esc(it.q)}</div>
      ${!ok?`<div class="small" style="color:var(--bad);margin-top:6px">Your answer: ${r.ans[i]===null?'(blank)':esc(it.c[r.ans[i]])}</div>`:''}<div class="small" style="color:var(--ok)">Correct: ${esc(it.c[it.a])}</div>${it.x?`<div class="small muted" style="margin-top:6px">${esc(it.x)}</div>`:''}</div>`;}).join('')}`;
  }
  const it=r.items[r.i],answered=r.ans.filter(x=>x!==null).length;
  return `<div class="runbar"><button class="btn ghost sm" data-act="exit">✕ Exit</button><div class="prog"><i style="width:${pct(answered,n)}%"></i></div><span class="timer" id="timer">${fmt((r.end-Date.now())/1000)}</span></div>
    <div class="row between"><span class="small muted">Question ${r.i+1} of ${n}</span><button class="btn sm ${r.flags.includes(r.i)?'on':''}" data-act="flag">${r.flags.includes(r.i)?'⚑ Flagged':'⚐ Flag for review'}</button></div>
    <div class="qtext">${esc(it.q)}</div>
    ${it.c.map((c,i)=>`<button class="opt ${r.ans[r.i]===i?'sel':''}" data-act="epick" data-v="${i}"><span class="k">${'ABCDE'[i]}</span><span>${esc(c)}</span></button>`).join('')}
    <div class="row between" style="margin-top:6px"><button class="btn" data-act="enav" data-v="-1" ${r.i===0?'disabled':''}>← Prev</button><button class="btn" data-act="enav" data-v="1" ${r.i===n-1?'disabled':''}>Next →</button></div>
    <div class="navgrid">${r.items.map((_,i)=>`<button class="${r.ans[i]!==null?'ans':''} ${i===r.i?'cur':''} ${r.flags.includes(i)?'fl':''}" data-act="ejump" data-v="${i}">${i+1}</button>`).join('')}</div>
    <button class="btn primary" style="width:100%;padding:13px" data-act="esubmit">Submit testlet (${answered}/${n} answered)</button>`;
}
function submitExam(timeout=false){
  const r=S.run;if(r.done)return;r.done=true;r.timeout=timeout;r.used=Math.min(r.total,(Date.now()-r.t0)/1000);
  let right=0;r.items.forEach((it,i)=>{const ok=r.ans[i]===it.a;if(ok)right++;const x=findItem(it.kind,it.id);if(x){ok?x.ok++:x.miss++;x.lr=ok?1:0;x.last=Date.now();}});
  logActivity(r.items.length);pushSession('exam',right,r.items.length);stopTimer();render();window.scrollTo(0,0);
}
function rWrite(){
  const r=S.run;
  if(r.i>=r.items.length){
    return `${runbar(1,1)}<div class="result"><div class="eyebrow">Active recall done</div><div class="score">${r.know.length}/${r.items.length}</div><p class="muted">recalled correctly</p><div class="row" style="justify-content:center">${r.learn.length?`<button class="btn primary" data-act="flashAgain">Redo ${r.learn.length} missed</button>`:''}<button class="btn" data-act="exit">Done</button></div></div>`;
  }
  const c=findItem('card',r.items[r.i]);if(!c){r.i++;return rWrite();}
  return `${runbar(r.i,r.items.length)}
    <div class="row"><span class="tag">${esc(c.t)}</span></div>
    <div class="qtext">${esc(c.f)}</div>
    <textarea id="recall" placeholder="Write the answer from memory — key terms, the rule, an example…" ${r.revealed?'readonly':''}>${esc(r.typed||'')}</textarea>
    ${r.revealed?`<div class="expl"><div class="eyebrow" style="margin-bottom:4px">Answer</div><div style="white-space:pre-wrap">${esc(c.b)}</div></div>
      <div class="small muted" style="margin-bottom:8px">How did you do?</div>
      <div class="grid" style="grid-template-columns:1fr 1fr 1fr;gap:8px"><button class="btn g-again" data-act="wr" data-v="0">Missed it</button><button class="btn" data-act="wr" data-v="1">Partly</button><button class="btn g-good" data-act="wr" data-v="2">Nailed it</button></div>`
    :`<button class="btn primary" style="width:100%;padding:13px;margin-top:10px" data-act="reveal">Check answer</button>`}`;
}
function rMatch(){
  const r=S.run;
  if(r.fin){const best=D().matchBest;return `${runbar(1,1)}<div class="result"><div class="eyebrow">Matched!</div><div class="score">${r.time.toFixed(1)}s</div><p class="muted">${r.newBest?'New personal best 🎉':best?`Best: ${best.toFixed(1)}s`:''}${r.pen?` · includes ${r.pen}s in mismatch penalties`:''}</p><div class="row" style="justify-content:center"><button class="btn primary" data-act="matchAgain">Play again</button><button class="btn" data-act="exit">Done</button></div></div>`;}
  return `<div class="runbar"><button class="btn ghost sm" data-act="exit">✕ Exit</button><span class="spacer"></span><span class="small muted">Tap a term, then its match · +1s per miss</span><span class="timer" id="timer">0.0s</span></div>
    <div class="match">${r.tiles.map((t,i)=>`<button class="mt ${t.term?'term':''} ${r.sel===i?'sel':''} ${r.gone.includes(i)?'gone':''} ${r.bad&&r.bad.includes(i)?'bad':''}" data-act="mt" data-v="${i}">${esc(t.txt)}</button>`).join('')}</div>`;
}
function rTeach(){
  const r=S.run,d=D();
  if(r.stage==='pick'){
    return `<div class="runbar"><button class="btn ghost sm" data-act="exit">✕ Exit</button></div>
    <div class="eyebrow">Teach it back</div><h2 style="margin:4px 0 8px">Pick a topic to explain</h2>
    <p class="muted small">Pretend you're explaining it to a new staff accountant. Use plain words, give an example, and note the exceptions. Where you get stuck is what to study next.</p>
    <div class="seg" style="margin:12px 0">${topics(d).map(t=>`<button data-act="tpick" data-v="${esc(t)}">${esc(t)}</button>`).join('')}</div>
    <div class="row"><input type="text" id="tCustom" placeholder="…or type any topic" style="flex:1"><button class="btn primary" data-act="tcustom">Go</button></div>`;
  }
  return `<div class="runbar"><button class="btn ghost sm" data-act="exit">✕ Exit</button></div>
    <div class="eyebrow">Teach it back</div><h2 style="margin:4px 0 10px">${esc(r.topic)}</h2>
    <textarea id="tText" style="min-height:200px" placeholder="Explain ${esc(r.topic)} in your own words…">${esc(r.text)}</textarea>
    <div class="panel" style="margin-top:10px"><b class="small">Self-check</b>
      ${['I defined the key terms without jargon','I gave a concrete example (with numbers if it applies)','I explained WHY the rule works, not just what it is','I mentioned exceptions or common exam traps','I could answer a follow-up question about it'].map(x=>`<label class="check small"><input type="checkbox"><span>${x}</span></label>`).join('')}</div>
    ${r.fb?`<div class="expl ai" id="tFb">${esc(r.fb)}</div>`:'<div id="tFb"></div>'}
    <div class="row" style="margin-top:10px">${S.sample?`<button class="btn" data-act="tfb">✦ Get feedback from Claude</button>`:''}<span class="spacer"></span><button class="btn primary" data-act="tsave">Save & finish</button></div>`;
}

/* ---------------- Events ---------------- */
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,r=S.run,d=S.sec?D():null;
  switch(a){
    case 'home': if(S.run)stopTimer(); S.run=null;S.sec=null;history.replaceState(null,'',location.pathname+location.search);applySecTheme();render();window.scrollTo(0,0);break;
    case 'open': S.sec=b.dataset.sec;S.tab='study';S.q='';S.filter='all';location.hash=S.sec.toLowerCase();applySecTheme();render();window.scrollTo(0,0);break;
    case 'tab': S.tab=b.dataset.tab;render();break;
    case 'filter': S.filter=b.dataset.f;render();break;
    case 'close': closeModal();break;
    case 'addCard': editCard(null);break;
    case 'addMcq': editMcq(null);break;
    case 'import': importDlg();break;
    case 'export': exportDlg();break;
    case 'gen': genDlg();break;
    case 'genPage': genDlg('page');break;
    case 'star': {const x=findItem(b.dataset.k,b.dataset.id);x.star=!x.star;save();$('#list').innerHTML=renderList();break;}
    case 'edit': {const x=findItem(b.dataset.k,b.dataset.id);b.dataset.k==='card'?editCard(x):editMcq(x);break;}
    case 'del': {if(await confirmBox('This item and its progress will be removed.')){const k=b.dataset.k==='card'?'cards':'mcqs';d[k]=d[k].filter(x=>x.id!==b.dataset.id);save();render();}break;}
    case 'resetSched': if(await confirmBox('All cards in this section go back to "new" and their history is cleared.','Reset')){d.cards.forEach(c=>{c.box=0;c.due=0;c.ok=0;c.miss=0;c.lr=null;});d.mcqs.forEach(m=>{m.ok=0;m.miss=0;m.lr=null;});save();render();}break;
    case 'start': {const m=b.dataset.mode;if(['flash','quiz','exam','write'].includes(m))setupDlg(m);else startRun(m);break;}
    case 'exit': if(r&&r.mode==='exam'&&!r.done){if(!(await confirmBox('Leave the exam? Your answers will not be scored.','Leave')))break;}endRun();break;
    case 'pomo': pomoDlg();break;
    // flashcards & review
    case 'flip': r.flip=!r.flip;render();break;
    case 'starRun': {const c=findItem('card',b.dataset.id);c.star=!c.star;save();render();break;}
    case 'fl': flashAnswer(+b.dataset.v);break;
    case 'flashAgain': {const ids=r.learn.slice();Object.assign(r,{items:shuffle(ids),i:0,know:[],learn:[],flip:false,revealed:false,typed:''});render();break;}
    case 'gr': reviewGrade(+b.dataset.v);break;
    // quiz
    case 'pick': quizPick(+b.dataset.v);break;
    case 'next': r.i++;r.pick=null;render();window.scrollTo(0,0);break;
    case 'retryMissed': {const items=shuffle(r.results.filter(x=>!x.ok).map(x=>x.it));Object.assign(r,{items,i:0,score:0,pick:null,results:[]});render();break;}
    case 'explain': explainMore();break;
    // exam
    case 'epick': r.ans[r.i]=+b.dataset.v;render();break;
    case 'enav': r.i=Math.max(0,Math.min(r.items.length-1,r.i+(+b.dataset.v)));render();break;
    case 'ejump': r.i=+b.dataset.v;render();break;
    case 'flag': r.flags.includes(r.i)?r.flags.splice(r.flags.indexOf(r.i),1):r.flags.push(r.i);render();break;
    case 'esubmit': {const un=r.ans.filter(x=>x===null).length;if(un&&!(await confirmBox(`${un} question${un>1?'s are':' is'} unanswered. Submit anyway?`,'Submit')))break;submitExam();break;}
    // write
    case 'reveal': r.typed=$('#recall').value;r.revealed=true;render();break;
    case 'wr': {const c=findItem('card',r.items[r.i]);const v=+b.dataset.v;grade(c,v===0?0:v===1?1:2);(v===2?r.know:r.learn).push(c.id);r.i++;r.revealed=false;r.typed='';if(r.i>=r.items.length)pushSession('write',r.know.length,r.items.length);render();break;}
    // match
    case 'mt': matchTap(+b.dataset.v);break;
    case 'matchAgain': startRun('match');break;
    // teach
    case 'tpick': r.topic=b.dataset.v;r.stage='write';render();break;
    case 'tcustom': {const v=$('#tCustom').value.trim();if(!v)return toast('Type a topic.');r.topic=v;r.stage='write';render();break;}
    case 'tfb': teachFeedback(b);break;
    case 'tsave': {r.text=$('#tText').value.trim();if(!r.text)return toast('Write your explanation first.');d.notes.push({id:uid(),topic:r.topic,text:r.text,fb:r.fb||'',d:Date.now()});if(d.notes.length>40)d.notes=d.notes.slice(-40);logActivity();save();toast('Saved to Progress → Teach-back notes');endRun();break;}
  }
});
function flashAnswer(v){const r=S.run;if(r.i>=r.items.length)return;const id=r.items[r.i];record('card',id,!!v);(v?r.know:r.learn).push(id);r.i++;r.flip=false;if(r.i>=r.items.length)pushSession('flash',r.know.length,r.items.length);render();}
function reviewGrade(g){const r=S.run;const id=r.queue.shift();const c=findItem('card',id);if(c){grade(c,g);r.seen++;if(g===0){r.againN++;r.queue.splice(Math.min(r.queue.length,3),0,id);}}r.flip=false;if(!r.queue.length)pushSession('review',r.seen,0+r.seen);render();}
function quizPick(v){const r=S.run;if(r.pick!==null)return;r.pick=v;const it=r.items[r.i],ok=v===it.a;if(ok)r.score++;r.results.push({it,pick:v,ok});record(it.kind,it.id,ok);if(r.i+1>=r.items.length)pushSession(r.weak?'weak':'quiz',r.score,r.items.length);render();}
function matchTap(i){const r=S.run;if(r.gone.includes(i)||r.fin)return;r.bad=null;
  if(r.sel===null){r.sel=i;}
  else if(r.sel===i){r.sel=null;}
  else{const A=r.tiles[r.sel],B=r.tiles[i];
    if(A.k===B.k&&A.term!==B.term){r.gone.push(r.sel,i);record('card',A.k,true);}
    else{r.bad=[r.sel,i];r.pen++;}
    r.sel=null;
    if(r.gone.length===r.tiles.length){r.fin=true;r.time=(Date.now()-r.t0)/1000+r.pen;const d=D();r.newBest=!d.matchBest||r.time<d.matchBest;if(r.newBest)d.matchBest=r.time;pushSession('match',Math.round(r.time),0);}}
  render();}
async function explainMore(){
  const r=S.run,it=r.items[r.i],el=$('#aiExp');if(!el)return;el.textContent='Thinking…';
  const prompt=`You are a CPA exam tutor for the ${S.sec} (${SECTIONS[S.sec].name}) section. A student answered this question wrong.
Question: ${it.q}
Choices: ${it.c.map((c,i)=>'ABCDE'[i]+') '+c).join(' | ')}
Correct answer: ${'ABCDE'[it.a]}) ${it.c[it.a]}
Student chose: ${'ABCDE'[r.pick]}) ${it.c[r.pick]}
In under 150 words of plain text: explain the underlying rule, why their choice is wrong, and give one memory tip.`;
  try{const res=await S.sample(prompt,{modelTier:'quick',onText:({text})=>{const e2=$('#aiExp');if(e2)e2.textContent=text;}});const e2=$('#aiExp');if(e2)e2.textContent=res.text;}
  catch(e){const e2=$('#aiExp');if(e2)e2.textContent=e&&e.code==='rate_limited'?'Too many requests — try again shortly.':'Could not get an explanation right now.';}
}
async function teachFeedback(btn){
  const r=S.run;r.text=$('#tText').value.trim();if(r.text.length<40)return toast('Write a bit more first.');
  btn.disabled=true;const out=$('#tFb');out.className='expl ai';out.textContent='Reading your explanation…';
  const prompt=`You are a supportive but rigorous CPA exam tutor for the ${S.sec} (${SECTIONS[S.sec].name}) section.
The student explained the topic "${r.topic}" in their own words:
"""${r.text}"""
Give feedback in plain text (no markdown symbols), under 230 words, with these short labeled parts:
Accurate: what they got right.
Fix: any technical errors or misconceptions, corrected.
Missing: key points or exam traps they left out.
Test yourself: 3 quick questions to check understanding (no answers).`;
  try{const res=await S.sample(prompt,{modelTier:'default',onText:({text})=>{out.textContent=text;}});r.fb=res.text;out.textContent=res.text;}
  catch(e){out.textContent=e&&e.code==='rate_limited'?'Too many requests — try again shortly.':'Could not get feedback right now.';}
  btn.disabled=false;
}

/* keyboard */
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&$('#modal').classList.contains('open')){closeModal();return;}
  const tg=e.target.tagName;if(tg==='INPUT'||tg==='TEXTAREA'||tg==='SELECT'||$('#modal').classList.contains('open'))return;
  const r=S.run;if(!r)return;
  if(r.mode==='flash'&&r.i<r.items.length){if(e.key===' '){e.preventDefault();r.flip=!r.flip;render();}else if(e.key==='ArrowRight')flashAnswer(1);else if(e.key==='ArrowLeft')flashAnswer(0);}
  else if(r.mode==='review'&&r.queue.length){if(e.key===' '){e.preventDefault();r.flip=!r.flip;render();}else if(r.flip&&'1234'.includes(e.key))reviewGrade(+e.key-1);}
  else if(r.mode==='quiz'&&r.i<r.items.length){const k=e.key.toLowerCase();const idx='abcde'.indexOf(k)>=0?'abcde'.indexOf(k):'12345'.indexOf(k);
    if(r.pick===null&&idx>=0&&idx<r.items[r.i].c.length)quizPick(idx);else if(r.pick!==null&&e.key==='Enter'){r.i++;r.pick=null;render();}}
  else if(r.mode==='exam'&&!r.done){const idx='abcde'.indexOf(e.key.toLowerCase());if(idx>=0&&idx<r.items[r.i].c.length){r.ans[r.i]=idx;render();}else if(e.key==='ArrowRight'&&r.i<r.items.length-1){r.i++;render();}else if(e.key==='ArrowLeft'&&r.i>0){r.i--;render();}}
});

/* ---------------- Pomodoro focus timer ---------------- */
const P={phase:'focus',len:{focus:25,brk:5},left:25*60,on:false,int:null,ctx:null};
function pomoChip(){const c=$('#pomoChip');c.textContent=(P.phase==='focus'?'◷ ':'☕ ')+fmt(P.left);c.classList.toggle('run',P.on);}
function pomoTick(){P.left--;if(P.left<=0){beep();if(P.phase==='focus'){S.prefs.pomos=(S.prefs.pomos||0)+1;savePrefs();toast('Focus session done — take a 5-minute break.');P.phase='brk';}else{toast('Break over — back to it.');P.phase='focus';}P.left=P.len[P.phase]*60;}pomoChip();const t=$('#pomoBig');if(t)t.textContent=fmt(P.left);}
function beep(){try{const c=P.ctx;if(!c)return;[0,.25,.5].forEach(t=>{const o=c.createOscillator(),g=c.createGain();o.frequency.value=880;g.gain.setValueAtTime(.18,c.currentTime+t);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+t+.2);o.connect(g).connect(c.destination);o.start(c.currentTime+t);o.stop(c.currentTime+t+.22);});}catch(e){}}
function pomoDlg(){
  const draw=()=>{openModal(`<h2>Focus timer</h2><p class="muted small" style="margin-top:-6px">The Pomodoro technique: 25 minutes of focused study, then a 5-minute break. Short, timed blocks beat long, distracted ones.</p>
    <div style="text-align:center;margin:18px 0"><div class="eyebrow">${P.phase==='focus'?'Focus':'Break'}</div><div id="pomoBig" style="font-family:var(--mono);font-size:56px;font-weight:600">${fmt(P.left)}</div></div>
    <div class="row" style="justify-content:center;margin-bottom:12px"><span class="small muted">Focus</span><div class="seg" id="pF">${[15,25,45,50].map(x=>`<button data-v="${x}" class="${P.len.focus===x?'on':''}">${x}m</button>`).join('')}</div></div>
    <div class="foot" style="justify-content:center"><button class="btn" id="pReset">Reset</button><button class="btn primary" id="pGo">${P.on?'Pause':'Start'}</button></div>`);
    $('#pGo').onclick=()=>{try{if(!P.ctx)P.ctx=new (window.AudioContext||window.webkitAudioContext)();else P.ctx.resume();}catch(e){}
      if(P.on){clearInterval(P.int);P.on=false;}else{P.int=setInterval(pomoTick,1000);P.on=true;}pomoChip();draw();};
    $('#pReset').onclick=()=>{clearInterval(P.int);P.on=false;P.phase='focus';P.left=P.len.focus*60;pomoChip();draw();};
    $('#pF').onclick=e=>{const b=e.target.closest('button');if(!b)return;P.len.focus=+b.dataset.v;if(!P.on&&P.phase==='focus')P.left=P.len.focus*60;pomoChip();draw();};
  };draw();
}
</script>
